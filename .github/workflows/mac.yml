name: Mac beta
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: arc-bridge-mac-beta
          path: |
            release/*.dmg
            release/*.zip
